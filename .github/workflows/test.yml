name: Test AegisIR
on:
  push:
  pull_request:
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Go vet
        run: go vet ./...
      - name: Go unit tests
        run: go test ./... -race -count=1
      - name: Python unit tests
        run: PYTHONPATH=python python3 -m unittest discover -s python -p 'test_*.py' -v
      - name: Build and smoke test
        run: make smoke
